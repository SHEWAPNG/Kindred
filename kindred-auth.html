<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindred — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF5F5;
    --accent: #FF8A8A;
    --text: #3D2B2B;
    --muted: #5C4A4A;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .auth-card {
    background: white;
    padding: 48px 40px;
    border-radius: 28px;
    width: 100%;
    max-width: 420px;
    border: 2px solid var(--accent);
    box-shadow: 0 20px 60px rgba(255,138,138,0.15);
    text-align: center;
  }
  .logo {
    font-family: 'Fraunces', serif;
    font-size: 2.8rem;
    color: var(--accent);
    margin-bottom: 8px;
  }
  h1 { font-size: 1.6rem; margin-bottom: 8px; color: var(--text); }
  p { color: var(--muted); margin-bottom: 32px; font-size: 1.05rem; }
  input[type="email"] {
    width: 100%;
    padding: 16px 20px;
    font-size: 1.1rem;
    border: 2px solid #e8d5d5;
    border-radius: 16px;
    background: #fffaf5;
    color: var(--text);
    margin-bottom: 24px;
  }
  input[type="email"]:focus {
    outline: none;
    border-color: var(--accent);
    background: white;
  }
  button {
    width: 100%;
    padding: 16px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 50px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: #e66a6a; }
  .message { margin-top: 20px; font-size: 0.98rem; min-height: 24px; }
  .success { color: #2e7d32; }
  .error { color: #d32f2f; }
</style>
</head>
<body>

<div class="auth-card">
  <div class="logo">Kindred</div>
  <h1>Sign in</h1>
  <p>No password needed. We'll send you a magic link.</p>

  <input type="email" id="emailInput" placeholder="your@email.com" autocomplete="email">

  <button onclick="sendMagicLink()">Send Magic Link →</button>

  <div id="message" class="message"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Supabase client MUST be created BEFORE any function uses it
  const SUPABASE_URL  = 'https://zfjadtqjzziqnqqkrekk.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmamFkdHFqenppcW5xcWtyZWtrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4MjAxOTUsImV4cCI6MjA4ODM5NjE5NX0.ga1GQEq5BO4DRZlNOUY9d7Zsx2bMfzxlxlc0WIvhb_E';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  async function sendMagicLink() {
    const email = document.getElementById('emailInput').value.trim().toLowerCase();
    const msgEl = document.getElementById('message');

    if (!email || !email.includes('@')) {
      msgEl.className = 'message error';
      msgEl.textContent = "Please enter a valid email";
      return;
    }

    msgEl.textContent = "Sending magic link...";

    try {
      const { error } = await sb.auth.signInWithOtp({
        email: email,
        options: {
          emailRedirectTo: 'https://kindred-evk6.onrender.com/kindred-app.html',
          shouldCreateUser: true
        }
      });

      if (error) throw error;

      msgEl.className = 'message success';
      msgEl.textContent = `Magic link sent to ${email} ✓ Check your inbox (and spam)`;

    } catch (err) {
      msgEl.className = 'message error';
      msgEl.textContent = err.message || "Failed to send link. Try again.";
    }
  }

  // Allow pressing Enter
  document.getElementById('emailInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMagicLink();
  });
</script>
</body>
</html>
